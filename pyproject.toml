[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unmochon-live"
version = "0.2.0"
description = "Original Unmochon hybrid RAG engine with the unchanged Live visual shell"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2",
  "pydantic>=2,<3", "flask>=3,<4", "chromadb==1.5.9", "rank-bm25==0.2.2",
  "sentence-transformers==3.0.1", "transformers==4.44.2", "sentencepiece>=0.2,<1",
  "torch==2.8.0", "numpy>=1.26,<3", "filelock>=3,<5", "beautifulsoup4>=4.12,<5"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ocr = ["PyMuPDF>=1.24,<2", "pytesseract>=0.3.10,<1", "Pillow>=10,<13", "bijoy2unicode>=0.1"]
layout = ["datasets>=2.20,<4", "accelerate>=0.33,<2", "opencv-python>=4.10,<5", "shapely>=2,<3", "ultralytics>=8,<9"]
metadata = ["openpyxl>=3.1,<4", "pandas>=2,<3"]
explanation = ["google-generativeai==0.8.3"]

[project.scripts]
unmochon-live = "unmochon_live.cli:main"

[tool.setuptools]
py-modules = ["original_paths"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["unmochon_live*", "scripts*", "chatbot*", "UI*", "DATE_eXTRACTION*", "layout_analysis*"]
exclude = ["tests*", "data*", "work*"]

[tool.setuptools.package-data]
unmochon_live = ["ui/templates/*", "ui/static/*", "ui/static/fonts/*", "ui/static/logo/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
