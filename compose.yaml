services:
  unmochon:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The original database, future chunks and explanation cache survive restarts.
      - ./data:/app/data
      - model_cache:/root/.cache/huggingface
    restart: unless-stopped
    init: true
volumes:
  model_cache:
